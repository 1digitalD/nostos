<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nostos{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=3">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Nostos</a>
    <span class="meta">profile: {{ profile_id }}</span>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>127.0.0.1 only · single user · share via <code>nostos web --export</code></span>
  </footer>
</body>
</html>
