<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Nostos{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=11">
</head>
<body>
  {% set active_city = request.app.state.nostos.context.profile.city %}
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="/" aria-label="Nostos listings">
        <span class="brand-mark" aria-hidden="true">N</span>
        <span>Nostos</span>
      </a>
      <nav class="primary-nav" aria-label="Primary navigation">
        <a href="/">Listings</a>
        <a href="/profile">Criteria</a>
        <details class="city-switcher">
          <summary>{{ active_city|title }}</summary>
          <div class="city-menu">
            <a href="/switch-city/toronto" {% if active_city == 'toronto' %}aria-current="page"{% endif %}>Toronto</a>
            <a href="/switch-city/vancouver" {% if active_city == 'vancouver' %}aria-current="page"{% endif %}>Vancouver</a>
          </div>
        </details>
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">
    <span>Private rental decision workspace</span>
    <span>Data stays on this host</span>
  </footer>
</body>
</html>
